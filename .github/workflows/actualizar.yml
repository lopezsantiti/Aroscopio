name: Actualizar datos

on:
  schedule:
    - cron: '17 13 * * *'   # todos los días a las 10:17 de Argentina
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bajar partidos y calcular probabilidades
        run: node scripts/actualizar.mjs
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      - name: Guardar los datos nuevos
        run: |
          git config user.name "aroscopio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Datos del $(date -u +%F)"
          git push
